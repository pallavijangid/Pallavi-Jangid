  <script>
    (function () {
      const timeoutMs = 2400;
      document.querySelectorAll('.js-smart-gif').forEach((img) => {
        const gifSrc = img.dataset.gif;
        const pngSrc = img.dataset.png;
        let done = false;
        const probe = new Image();
        const timer = setTimeout(() => {
          if (!done) img.src = pngSrc;
        }, timeoutMs);
        probe.onload = function () { done = true; clearTimeout(timer); img.src = gifSrc; };
        probe.onerror = function () { done = true; clearTimeout(timer); img.src = pngSrc; };
        probe.src = gifSrc;
      });
    })();
  </script>
